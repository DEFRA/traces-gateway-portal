version: '3.4'
services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  # The Blazor frontend. It doesn't use floci, redis or mongodb yet, so it doesn't depend on them.
  traces-gateway-portal:
    build: ./
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      ASPNETCORE_ENVIRONMENT: Production
      # Fills {environment} in the health check URLs. CDP sets this when deployed.
      ENVIRONMENT: local
      # cdp-int hosts aren't reachable locally, so point the checks at local containers, e.g.:
      # HealthChecks__Services__0__Url: http://trade-gateway:8085/health/all
      # HealthChecks__Services__1__Url: http://trade-gateway-publisher:8085/health/all
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cdp-tenant

  # your-backend:
  #   image: defradigital/your-backend:${YOUR_BACKEND_VERSION:-latest}
  #   ports:
  #     - '3555:3555'
  #   links:
  #     - 'foci:floci'
  #     - 'mongodb:mongodb'
  #   depends_on:
  #     floci:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_started
  #   env_file:
  #     - 'compose/aws.env'
  #   environment:
  #     PORT: 3001
  #     NODE_ENV: development
  #     MONGO_URI: mongodb://mongodb:27017/
  #   networks:
  #     - cdp-tenant

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
