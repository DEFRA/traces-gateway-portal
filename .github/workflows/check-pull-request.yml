name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet restore TracesGatewayPortal.slnx
          dotnet build TracesGatewayPortal.slnx --configuration Release --no-restore -warnaserror

      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list TracesGatewayPortal.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q -i "has the following vulnerable packages" vulnerable.txt

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag traces-gateway-portal .
          exit $?

