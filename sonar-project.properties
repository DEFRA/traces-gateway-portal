# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/how-to/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_traces-gateway-portal
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/traces-gateway-portal
sonar.links.ci=https://github.com/DEFRA/traces-gateway-portal/actions
sonar.links.scm=https://github.com/DEFRA/traces-gateway-portal
sonar.links.issue=https://github.com/DEFRA/traces-gateway-portal/issues

# .NET projects are analysed with dotnet-sonarscanner (SonarScanner for .NET), which reads
# the project files directly; see the CDP SonarCloud how-to linked above.
sonar.sources=src/
sonar.exclusions=src/**/wwwroot/lib/**,src/**/wwwroot/assets/**
